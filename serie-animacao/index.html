   Episódios 1 a 3: só Miguel. Criatura aparece apenas no episódio 4.
   Eventos: [tempo, tipo, valor]. Legendas: [início, fim, falante, texto].
   Mundo congelado: 'stop' true faz objetos e pessoas pararem;
   Miguel e o relógio do quarto seguem o tempo normal.

const W=1080,H=1920,FY=1560;
const cv=document.getElementById('c');cv.width=W;cv.height=H;

const Q=new URLSearchParams(location.search);

const EPN=Q.has('ep')?parseInt(Q.get('ep')):1;

const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const sr=i=>{const v=Math.sin(i*127.1+311.7)*43758.5453;return v-Math.floor(v);};
const mod=(a,n)=>((a%n)+n)%n;

/* ---------- estado a partir dos eventos ---------- */
function stateAt(ep,t){
  const S={bg:'black',emo:'calm',x:540,arm:{L:'down',R:'down'},stop:false,
    ballOn:false,ballFall:null,cupT:null,pencil:'none',pencilT:0,
    clockRun:true,wind:.2,birds:false,creature:false,card:false,glint:false,gaze:0};
  for(const e of ep.ev){
    if(e[0]>t)break;
    const [,k,v]=e;
    switch(k){
      case'bg':S.bg=v;break;case'emo':S.emo=v;break;case'x':S.x=v;break;
      case'arm':S.arm=Object.assign({},S.arm,v);break;case'stop':S.stop=v;break;
      case'gaze':S.gaze=v;break;case'wind':S.wind=v;break;case'birds':S.birds=v;break;
      case'creature':S.creature=v;break;case'card':S.card=v;break;case'glint':S.glint=v;break;
      case'ball':if(v==='roll')S.ballOn=true;if(v==='fall')S.ballFall=e[0];break;
      case'cup':if(v==='idle')S.cupT=null;if(v==='fall')S.cupT=e[0];break;
      case'pencil':S.pencil=v;S.pencilT=e[0];break;
      case'clock':S.clockRun=(v==='run');break;
    }
  }
  return S;
}

/* ---------- Miguel ---------- */
const POSE={L:{down:[-104,-150],hold:[-60,-330]},R:{down:[104,-150],up:[160,-360],out:[200,-260]}};
let cur={p:{...EMO.calm},hl:[-104,-150],hr:[104,-150],x:540};
function drawMiguel(x,t,P,hL,hR,blink,walk){
  const br=Math.sin(t*2.2)*3;
  const bob=Math.sin(t*1.3)*2;
  const tremble=Math.sin(t*45)*P.tr*1.2;
  ctx.save();ctx.translate(tremble,0);

  ctx.fillStyle='rgba(0,0,0,.5)';ctx.beginPath();ctx.ellipse(x,FY+6,130,22,0,0,7);ctx.fill();

  // pernas
  const fL=[x-44+walk,FY-8],fR=[x+46-walk,FY-8];
  ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#3a4256';ctx.lineWidth=50;
  ctx.beginPath();ctx.moveTo(x-34,FY-280);ctx.lineTo(fL[0],fL[1]-20);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+34,FY-280);ctx.lineTo(fR[0],fR[1]-20);ctx.stroke();
  ctx.fillStyle='#e6e9f2';
  ctx.beginPath();ctx.ellipse(fL[0]+6,fL[1],36,11,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(fR[0]+6,fR[1],36,11,0,0,7);ctx.fill();

  // camiseta
  ctx.fillStyle='#0d0e14';
  ctx.beginPath();ctx.moveTo(x-80,FY-440-br);ctx.quadraticCurveTo(x,FY-462-br,x+80,FY-440-br);
  ctx.lineTo(x+66,FY-270);ctx.lineTo(x-66,FY-270);ctx.closePath();ctx.fill();

  // braços: manga escura + antebraço de pele
  const arm=(sx,sy,h,side)=>{
    const ex=(sx+h[0])/2+side*12,ey=(sy+h[1])/2;
    ctx.strokeStyle='#0d0e14';ctx.lineWidth=30;
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();
    ctx.strokeStyle='#d8a585';ctx.lineWidth=20;
    ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(h[0],h[1]);ctx.stroke();
    ctx.fillStyle='#d8a585';ctx.beginPath();ctx.arc(h[0],h[1],13,0,7);ctx.fill();
  };
  arm(x-78,FY-440-br,hL,-1);
  arm(x+78,FY-440-br,hR,1);

  // cabeça
  const hx=x,hy=FY-560+bob-br*.3;
  ctx.save();ctx.translate(hx,hy);ctx.rotate(P.tilt+Math.sin(t*.9)*.03);
  ctx.fillStyle='#d8a585';ctx.fillRect(-18,40,36,50);
  ctx.fillStyle='#0b0b10';ctx.beginPath();ctx.ellipse(0,-14,70,74,0,0,7);ctx.fill();
  const fg=ctx.createLinearGradient(-60,-60,60,60);
  fg.addColorStop(0,'#f6cfb2');fg.addColorStop(1,'#d69d7d');
  ctx.fillStyle=fg;ctx.beginPath();ctx.ellipse(0,0,56,66,0,0,7);ctx.fill();
  ctx.fillStyle='#e0ad8e';ctx.beginPath();ctx.ellipse(-55,6,9,15,0,0,7);ctx.ellipse(55,6,9,15,0,0,7);ctx.fill();

  // rubor
  if(P.b>.02){ctx.fillStyle=`rgba(255,110,120,${P.b*.35})`;ctx.beginPath();ctx.ellipse(-32,22,11,7,0,0,7);ctx.ellipse(32,22,11,7,0,0,7);ctx.fill();}

  // franja (vento)
  ctx.strokeStyle='#0b0b10';ctx.lineCap='round';
  for(let i=0;i<8;i++){
    const sx=-58+i*16,w=Math.sin(t*2.4+i*.8)*5*WIND;
    ctx.lineWidth=7-Math.abs(i-3.5)*.4;
    ctx.beginPath();ctx.moveTo(sx,-74);
    ctx.quadraticCurveTo(sx*.8+w,-40,sx*.9+w*1.4,-18+Math.abs(i-3.5)*2);ctx.stroke();
  }

  // olhos
  const lookX=P.gz*5+Math.sin(t*.7)*1;
  for(const s of[-1,1]){
    const ex0=s*22,ey=-6,ry=9*P.e*blink;
    ctx.fillStyle='#f3efec';ctx.beginPath();ctx.ellipse(ex0,ey,12,Math.max(.5,ry),0,0,7);ctx.fill();
    ctx.save();ctx.beginPath();ctx.ellipse(ex0,ey,12,Math.max(.5,ry),0,0,7);ctx.clip();
    ctx.fillStyle='#2a1a22';ctx.beginPath();ctx.arc(ex0+lookX,ey+.5,6.5*P.p,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex0+lookX+2,ey-2,2.2,0,7);ctx.fill();
    ctx.restore();
    ctx.strokeStyle='#0b0b10';ctx.lineWidth=3.5;
    ctx.beginPath();ctx.ellipse(ex0,ey,13,Math.max(.5,ry)+1,0,Math.PI*1.05,Math.PI*1.95);ctx.stroke();
    // sobrancelhas: interna perto do centro (s*12), externa (s*38)
    ctx.strokeStyle='#0b0b10';ctx.lineWidth=5;
    ctx.beginPath();
    ctx.moveTo(s*12,-24+P.bi*12);
    ctx.quadraticCurveTo(s*26,-27+(P.bi+P.bo)*6,s*38,-24+P.bo*12);
    ctx.stroke();
  }

  // nariz e boca
  ctx.strokeStyle='rgba(120,60,40,.4)';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(0,6);ctx.lineTo(-2,18);ctx.stroke();
  ctx.strokeStyle='#7a3b33';ctx.lineWidth=3.5;
  if(P.o>.08){
    ctx.fillStyle='#5b1f22';ctx.beginPath();ctx.ellipse(0,32,6+P.o*2,2+P.o*8,0,0,7);ctx.fill();
  }else{
    ctx.beginPath();ctx.moveTo(-11,34-P.c*3);ctx.quadraticCurveTo(0,36-P.c*8,11,34-P.c*3);ctx.stroke();
  }

  // gota de suor
  if(P.sw>.05){
    ctx.globalAlpha=P.sw;ctx.fillStyle='#8fd3ff';
    ctx.beginPath();ctx.moveTo(50,-70);ctx.quadraticCurveTo(58,-56,50,-50);ctx.quadraticCurveTo(42,-56,50,-70);ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.restore();
  ctx.restore();
}

/* ---------- personagens e objetos ---------- */
function person(x,y,c,sim){
  const sw=Math.sin(sim*4+x)*10;
  ctx.strokeStyle='#0c0d12';ctx.lineWidth=12;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x,y-70);ctx.lineTo(x-10+sw,y);ctx.moveTo(x,y-70);ctx.lineTo(x+10-sw,y);ctx.stroke();
  ctx.fillStyle=c;ctx.fillRect(x-16,y-150,32,84);
  ctx.fillStyle='#d8a585';ctx.beginPath();ctx.arc(x,y-166,13,0,7);ctx.fill();
  ctx.fillStyle='#0c0d12';ctx.beginPath();ctx.arc(x,y-170,13,Math.PI,0);ctx.fill();
}
function bird(x,y,f){
  ctx.strokeStyle='#0a0a0a';ctx.lineWidth=4;ctx.lineCap='round';
  const w=Math.sin(f)*12;
  ctx.beginPath();ctx.moveTo(x-18,y-w);ctx.quadraticCurveTo(x-6,y-6,x,y);ctx.quadraticCurveTo(x+6,y-6,x+18,y-w);ctx.stroke();
}
function leaf(x,y,rot){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);
  ctx.fillStyle='#5a7a2a';ctx.beginPath();ctx.ellipse(0,0,22,9,0,0,7);ctx.fill();
  ctx.restore();
}

/* ---------- criatura (apenas episódio 4) ---------- */
function drawCreature(x,t,topY){
  ctx.save();ctx.translate(x,topY);ctx.scale(1.7,1.7);
  const br=Math.sin(t*.8)*5;
  const ag=ctx.createRadialGradient(0,450,50,0,450,700);
  ag.addColorStop(0,'rgba(90,20,140,.35)');ag.addColorStop(1,'rgba(90,20,140,0)');
  ctx.fillStyle=ag;ctx.fillRect(-800,-300,1600,1400);
  ctx.fillStyle='#050608';ctx.strokeStyle='#050608';ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-190,230+br);ctx.quadraticCurveTo(0,120+br,190,230+br);
  ctx.lineTo(120,700);ctx.lineTo(-120,700);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.ellipse(-180,260,70,90,-.3,0,7);ctx.ellipse(180,260,70,90,.3,0,7);ctx.fill();
  ctx.lineWidth=80;
  ctx.beginPath();ctx.moveTo(-180,270);ctx.quadraticCurveTo(-300,500,-250,800+br);ctx.stroke();
  ctx.beginPath();ctx.moveTo(180,270);ctx.quadraticCurveTo(300,500,250,800-br);ctx.stroke();
  ctx.beginPath();ctx.ellipse(0,60+br,95,115,0,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(-70,20+br);ctx.lineTo(-170,-110);ctx.lineTo(-30,-10+br);ctx.fill();
  ctx.beginPath();ctx.moveTo(70,20+br);ctx.lineTo(170,-110);ctx.lineTo(30,-10+br);ctx.fill();
  ctx.strokeStyle=`rgba(140,70,255,${.5+.2*Math.sin(t*2)})`;ctx.lineWidth=5;
  ctx.beginPath();ctx.ellipse(0,60+br,95,115,0,-2.2,-.6);ctx.stroke();
  const eg=.8+.2*Math.sin(t*3);
  ctx.shadowColor='#ff2a4a';ctx.shadowBlur=40;
  ctx.fillStyle=`rgba(255,60,90,${eg})`;
  for(const s of[-1,1]){ctx.beginPath();ctx.ellipse(s*38,55+br,24,11,s*.15,0,7);ctx.fill();}
  ctx.shadowBlur=0;
  ctx.restore();
}

/* ---------- cenários ---------- */
function drawBG(name,t,S,sim,clockT){
  if(name==='black'){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);return;}
  const night=name!=='bed_am'&&name!=='school';
  let g=ctx.createLinearGradient(0,0,0,H);
  if(name==='bed_am'){g.addColorStop(0,'#f2d7b0');g.addColorStop(1,'#7a5a3f');}
  else if(name==='school'){g.addColorStop(0,'#cfe0ea');g.addColorStop(1,'#6e7f88');}
  else if(name==='dream'){g.addColorStop(0,'#1a0633');g.addColorStop(1,'#050510');}
  else if(name==='street'){g.addColorStop(0,'#03040a');g.addColorStop(1,'#1d2038');}
  else{g.addColorStop(0,'#0b0d1c');g.addColorStop(1,'#1c1a28');}
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  if(name==='bed_am'){
    ctx.fillStyle='rgba(255,240,200,.55)';ctx.fillRect(60,260,380,520);
    ctx.fillStyle='#8a6a4f';ctx.fillRect(0,1240,440,320);
    ctx.fillStyle='#e7d7c2';ctx.fillRect(0,1180,440,80);
    ctx.fillStyle='#5b4330';ctx.fillRect(0,FY+10,W,H);
  }
  if(name==='bed_night'||name==='street'||name==='dream'||name==='window'){
    if(name==='bed_night'){
      ctx.fillStyle='rgba(120,150,220,.25)';ctx.fillRect(60,260,380,520);
      ctx.fillStyle='#14162a';ctx.fillRect(0,0,W,H*.0+1);
      // relógio de parede
      ctx.fillStyle='#f4efe2';ctx.beginPath();ctx.arc(800,520,80,0,7);ctx.fill();
      ctx.strokeStyle='#2a2a2a';ctx.lineWidth=8;ctx.stroke();
      ctx.lineCap='round';ctx.lineWidth=7;
      const ma=clockT*.9-Math.PI/2,ha=clockT*.08-Math.PI/2;
      ctx.beginPath();ctx.moveTo(800,520);ctx.lineTo(800+Math.cos(ha)*40,520+Math.sin(ha)*40);ctx.stroke();
      ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(800,520);ctx.lineTo(800+Math.cos(ma)*62,520+Math.sin(ma)*62);ctx.stroke();
      // mesa
      ctx.fillStyle='#3a2a20';ctx.fillRect(640,1180,420,40);
      ctx.fillStyle='#2a1e16';ctx.fillRect(660,1220,380,340);
      // cama
      ctx.fillStyle='#2b3350';ctx.fillRect(0,1240,300,320);
    }
    if(name==='window'){
      ctx.fillStyle='#0b1020';ctx.fillRect(180,280,720,800);
      for(let i=0;i<40;i++){ctx.fillStyle=`rgba(255,${180+sr(i)*60|0},120,${.3+sr(i+4)*.5})`;ctx.fillRect(200+sr(i+1)*680,300+sr(i+2)*700,10+sr(i)*14,10+sr(i+7)*20);}
      ctx.strokeStyle='#241a14';ctx.lineWidth=18;ctx.strokeRect(180,280,720,800);
      ctx.fillStyle='#3a2a20';ctx.fillRect(0,1400,W,H);
    }
    if(name==='street'){
      for(let i=0;i<14;i++){const x=i*110-40,h=420+sr(i)*700;ctx.fillStyle='#0a0c16';ctx.fillRect(x,1400-h,100,h);
        for(let r=0;r<h/50;r++)for(let c=0;c<3;c++)if(sr(i*9+r*3+c)<.3){ctx.fillStyle='rgba(255,190,120,.55)';ctx.fillRect(x+12+c*28,1400-h+16+r*50,12,18);}}
      ctx.fillStyle='#1d2130';ctx.fillRect(0,1400,W,120);
      ctx.fillStyle='#0e1119';ctx.fillRect(0,1520,W,H);
      ctx.fillStyle='rgba(220,230,255,.15)';
      for(let i=0;i<20;i++)ctx.fillRect(sr(i)*W,sr(i+30)*H*.5,2,60);
    }
    if(name==='dream'){
      const gb=ctx.createLinearGradient(0,400,W,900);
      gb.addColorStop(0,'rgba(180,80,255,0)');gb.addColorStop(.5,'rgba(230,150,255,.7)');gb.addColorStop(1,'rgba(180,80,255,0)');
      ctx.fillStyle=gb;ctx.beginPath();ctx.moveTo(0,300);ctx.lineTo(W,700);ctx.lineTo(W,820);ctx.lineTo(0,420);ctx.fill();
      ctx.fillStyle='#14062a';ctx.fillRect(0,FY+10,W,H);
    }
  }
  if(name==='school'){
    for(let i=0;i<5;i++){ctx.fillStyle=['#7b5cb0','#4f8a6b','#b06a4f','#4f6fb0','#a08a3a'][i];ctx.fillRect(i*216,900,200,500);}
    ctx.fillStyle='#8aa0a8';ctx.fillRect(0,1400,W,160);
    ctx.fillStyle='#c9d4d9';ctx.fillRect(0,FY+10,W,H);
    ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(0,1560,W,4);
  }
  if(name==='bed_am'||name==='school'){}
}

/* ---------- objetos (tempo simulado ou próprio) ---------- */
function drawObjects(S,t,sim){
  if(S.bg==='school'&&S.ballOn){
    const bx=200+clamp((sim-2.5)*180,0,380);
    let by=1330;
    if(S.ballFall!==null)by=Math.min(1500,1330+(t-S.ballFall)*(t-S.ballFall)*500);
    ctx.fillStyle='#e85a3a';ctx.beginPath();ctx.arc(bx,by,26,0,7);ctx.fill();
    person(200,1520,'#7a4f9a',sim);
  }
  if(S.bg==='school')person(200,1520,'#7a4f9a',sim);
  if(S.bg==='school')person(860,1520,'#3f7a5a',sim);
  if(S.bg==='bed_night'||S.bg==='window'){
    // desk / cup
    if(S.cupT!==null){
      const cy=Math.min(1180+(t-S.cupT)*(t-S.cupT)*900,1520);
      ctx.fillStyle='#e6e9f2';ctx.beginPath();ctx.roundRect(740,cy-40,46,50,6);ctx.fill();
    }else if(S.bg==='bed_night'){
      ctx.fillStyle='#e6e9f2';ctx.beginPath();ctx.roundRect(740,1140,46,40,6);ctx.fill();
    }
  }
  if(S.bg==='bed_night'&&S.pencil!=='none'){
    let py=1170;
    if(S.pencil==='lev')py=1170-140*ease(clamp((sim-5)/1.5))-(sim>5?0:0);
    if(S.pencil==='drop')py=1170-140*0+(t-S.pencilT)*(t-S.pencilT)*600;
    py=Math.min(py,1170);
    ctx.save();ctx.translate(560,py);ctx.rotate(S.pencil==='lev'?-.3:0);
    ctx.fillStyle='#f0b429';ctx.fillRect(-60,-6,120,12);
    ctx.fillStyle='#333';ctx.fillRect(-60,-6,10,12);
    ctx.restore();
  }
  if(S.bg==='street'){
    for(let i=0;i<8;i++){const x=mod(i*180-S.windPh,1300)-100;leaf(x,900+sr(i)*500,i*1.3+S.windPh*.01);}
    if(S.birds){for(let i=0;i<3;i++)bird(300+i*90+mod(sim*120,1000)*(i%2?1:.6),500+i*40,S.birdPh+i);}
  }
}

/* ---------- estado do relógio e do vento ---------- */
let simT=0,clockT=0,windPh=0,birdPh=0,tsRamp=1,lastT=0,Tloop=0;
let stateCache=null;

/* ---------- legendas e cartão ---------- */
function setSub(e){
  const el=$('sub');
  if(!e){el.classList.remove('on');return;}
  el.className='ov on'+(e[2]==='NARRADOR'?' narr':'');
  el.innerHTML=e[2]==='NARRADOR'?e[3]:`<b>${e[2]}</b>${e[3]}`;
}
let lastSub=null;

/* ---------- loop ---------- */
let WIND=.5,ep=null,t0=performance.now(),paused=false,last=performance.now();
function setEp(n){ep=EPS[n];ep.ev.sort((a,b)=>a[0]-b[0]);}
setEp(clamp(EPN,1,4));

function advance(dt,t){
  const S=stateAt(ep,t);
  const target=S.stop?0:1;
  tsRamp+=(target-tsRamp)*Math.min(1,dt*4);
  simT+=dt*tsRamp;
  if(S.clockRun)clockT+=dt;
  windPh+=dt*S.wind*700;
  birdPh+=dt*6;
  return S;
}

function frame(now){
  const dt=paused?0:Math.min(.05,(now-last)/1000);
  last=now;
  let t;
  if(FORCE!==null){
    if(!stateCache){simT=0;clockT=0;windPh=0;birdPh=0;tsRamp=1;for(let x=0;x<FORCE;x+=1/60)advance(1/60,x);stateCache=true;}
    t=FORCE;
  }else{
    Tloop=(Tloop+dt)%60;
    t=Tloop;
    if(t<lastT){simT=0;clockT=0;windPh=0;birdPh=0;tsRamp=1;}
    lastT=t;
    advance(dt,t);
  }
  const S=stateAt(ep,t);
  S.windPh=windPh;S.birdPh=birdPh;
  WIND=.5+.5*Math.sin(t*.9);

  // Miguel: expressão e posição suavizadas
  const k=FORCE!==null?1:Math.min(1,dt*7);
  const tg=EMO[S.emo]||EMO.calm;
  for(const key of Object.keys(tg))cur.p[key]=lerp(cur.p[key],tg[key],k);
  cur.p.gz=lerp(cur.p.gz||0,S.gaze,k);
  cur.x=lerp(cur.x,S.x,FORCE!==null?1:Math.min(1,dt*3));
  const hl=POSE.L[S.arm.L||'down'],hr=POSE.R[S.arm.R||'down'];
  cur.hl=[lerp(cur.hl[0],540+hl[0]-540,k),lerp(cur.hl[1],hl[1],k)];
  cur.hr=[lerp(cur.hr[0],hr[0],k),lerp(cur.hr[1],hr[1],k)];
  const hLw=[cur.x+cur.hl[0],FY+cur.hl[1]];
  const hRw=[cur.x+cur.hr[0],FY+cur.hr[1]];
  const blink=(t%3.3)<.12?.1:1;
  const walk=0;

  // mundo
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  drawBG(S.bg,t,S,simT,clockT);
  drawObjects(S,t,simT);
  if(S.glint&&S.bg==='window'){ /* brilho sutil nos olhos (reflexo na janela) */ }

  if(S.creature){
    ctx.globalAlpha=clamp((t-16)/1.2);
    drawCreature(800,t,240);
    ctx.globalAlpha=1;
  }

  drawMiguel(cur.x,t,cur.p,hLw,hRw,blink,walk);

  // tela: chuva leve no fundo da rua
  if(S.bg==='street'){
    ctx.fillStyle='rgba(220,230,255,.25)';
    for(let i=0;i<60;i++){const x=sr(i)*W,y=mod(sr(i+5)*H+t*900,H);ctx.fillRect(x,y,2,40);}
  }

  // legendas
  let sub=null;
  for(const e of ep.subs)if(t>=e[0]&&t<e[1]){sub=e;break;}
  const key=sub?sub.join('|'):'';
  if(key!==lastSub){setSub(sub);lastSub=key;}

  // cartão de pendência (embate)
  const card=$('card');
  card.classList.toggle('on',S.card);
  if(S.card)card.innerHTML='Embate do Episódio 4<small>Cena pendente, aguardando o roteiro do autor.</small>';

  // escurecimento de entrada/saída
  const fadeIn=t<1.2?clamp(1-t/1.2):0;
  $('fade').style.opacity=fadeIn;

  if(FORCE===null)requestAnimationFrame(frame);
}

$('wrap').addEventListener('click',e=>{if(e.target.tagName!=='SELECT')paused=!paused;});
$('sel').value=String(clamp(EPN,1,4));
$('sel').addEventListener('change',e=>{location.search='?ep='+e.target.value;});
requestAnimationFrame(frame);
</script>
</body>
